<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="description" content="NULL DILL – God mat. Lite styr! Enkle oppskrifter for hele familien.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>NULL DILL – God mat. Lite styr!</title>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">ND</span><div><strong>NULL DILL</strong><small>GOD MAT. LITE STYR!</small></div></div>
    <button id="menuBtn" class="icon-btn" aria-label="Åpne meny">☰</button>
  </header>
  <nav id="nav" class="nav hidden">
    <button data-view="home">Oppskrifter</button><button data-view="favorites">Favoritter</button><button data-view="list">Handleliste</button>
  </nav>
  <main>
    <section class="hero">
   <div class="hero-heading">
    <img src="logo.png.png" alt="NULL DILL – God mat. Lite styr!" class="hero-logo">
</div>
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Hva har du lyst på?"></label>
    </section>
    <section class="toolbar">
      <div><h2 id="sectionTitle">Siste oppskrifter</h2><p id="status" class="muted">Henter fra bloggen …</p></div>
      <select id="category" aria-label="Velg kategori"><option value="">Alle kategorier</option></select>
    </section>
    <section id="recipes" class="recipes"><div class="loading">Laster oppskrifter …</div></section>
    <section id="favoritesView" class="hidden"></section>
    <section id="listView" class="hidden">
      <div class="list-head"><h2>Handleliste</h2><button id="clearList" class="text-btn">Tøm lista</button></div>
      <form id="addItem"><input id="newItem" placeholder="Legg til en vare …" autocomplete="off"><button>Legg til</button></form>
      <ul id="shoppingList" class="shopping-list"></ul>
      <p class="muted">Handlelisten lagres på denne enheten.</p>
    </section>
  </main>
  <footer><span>NULL DILL</span><span>God mat. Lite styr!</span></footer>
  <dialog id="recipeDialog"><button class="close" id="closeDialog" aria-label="Lukk">×</button><div id="recipeContent"></div></dialog>
  <script src="app.js"></script>
  <script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
        .then(registration => {
            

            registration.addEventListener("updatefound", () => {
const newWorker = registration.installing;

if (!newWorker) return;

newWorker.addEventListener("statechange", () => {
                    if (
                        newWorker.state === "activated" &&
                        navigator.serviceWorker.controller
                    ) {
                        window.location.reload();
                    }
                });
            });
            registration.update();
            }).catch(error => console.error("Service worker-feil:", error));
}
</script>
</body>
</html>
